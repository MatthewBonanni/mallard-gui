[project]
name = "mallard-gui"
version = "0.1.0.dev0"
description = "A graphical front end for the Mallard compressible-flow solver: case setup, runs and monitoring"
readme = "README.md"
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics"]
authors = [
    { name = "Matthew Bonanni", email = "mbonanni001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "platformdirs>=4.14.8",
    "tomlkit>=0.15.2",
    "trame>=4.0.0",
    "trame-vtk>=2.11.17",
    "vtk>=9.7.2",
]

[project.scripts]
mallard-gui = "mallard_gui:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
bundle = [
    "pyinstaller>=6.22.3",
]
dev = [
    "mypy>=2.4.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "C4", "PIE", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# trame layouts nest one `with` per element, mirroring the DOM.
"src/mallard_gui/ui/*" = ["SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["vtkmodules.*", "trame.*", "trame_server.*", "trame_vtk.*", "trame_client.*", "trame_vuetify.*", "trame_common.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The parallel viewer's driver runs in ParaView's pvpython, with catalog.py copied beside it.
module = ["paraview.*", "catalog"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy_support is plain Python without annotations: its functions are Any here.
module = ["vtkmodules.util.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mallard: needs a local mallard build (set MALLARD or put mallard on PATH)",
    "ui: drives the app in Google Chrome through Playwright",
]
